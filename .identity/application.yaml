identity:
  url: "https://identity.${HOST}"
  flags:
    multi-tenancy: "false"

  authProvider:
    issuer-url: "https://keycloak.${HOST}/auth/realms/camunda-platform"
    backend-url: "http://${KEYCLOAK_HOST}:18080/auth/realms/camunda-platform"

  component-presets:
    connectors:
      applications:
        - name: Connectors
          id: connectors
          type: m2m
          secret: ${VALUES_KEYCLOAK_INIT_CONNECTORS_SECRET}
          permissions:
            - audience: "orchestration-api"
              definition: read:*
    identity:
      apis:
        - name: "Camunda Identity Resource Server"
          audience: "camunda-identity-resource-server"
          permissions:
            - definition: read
              description: "Read permission"
            - definition: "read:users"
              description: "Read users permission"
            - definition: write
              description: "Write permission"
      roles:
        - name: "ManagementIdentity"
          description: "Provides full access to Identity"
          permissions:
            - audience: "camunda-identity-resource-server"
              definition: read
            - audience: "camunda-identity-resource-server"
              definition: write
    orchestration:
      applications:
        - name: Orchestration
          id: orchestration
          type: confidential
          secret: ${VALUES_KEYCLOAK_INIT_ORCHESTRATION_SECRET}
          root-url: "https://orchestration.${HOST}"
          redirect-uris:
            - "/sso-callback"
      apis:
        - name: "Orchestration API"
          audience: "orchestration-api"
          permissions:
            - definition: read:*
              description: "Read permission"
            - definition: write:*
              description: "Write permission"
      roles:
        - name: "Orchestration"
          description: "Grants full access to Orchestration"
          permissions:
            - audience: "orchestration-api"
              definition: read:*
            - audience: "orchestration-api"
              definition: write:*
    optimize:
      applications:
        - name: Optimize
          id: optimize
          type: confidential
          secret: ${VALUES_KEYCLOAK_INIT_OPTIMIZE_SECRET}
          root-url: "https://optimize.${HOST}"
          redirect-uris:
            - "/api/authentication/callback"
      apis:
        - name: Optimize API
          audience: "optimize-api"
          permissions:
            - definition: write:*
              description: "Write permission"
      roles:
        - name: "Optimize"
          description: "Grants full access to Optimize"
          permissions:
            - audience: "optimize-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
        - name: "Analyst"
          description: "Grants full access to Optimize and to Hub. Additionally, grants management access to Hub's catalog and business intelligence features"
          permissions:
            - audience: "optimize-api"
              definition: write:*
    # Camunda Hub (8.10+) replaces Web Modeler and Console. The preset key,
    # client ID (web-modeler) and audiences (web-modeler-api,
    # web-modeler-public-api) stay unchanged for compatibility.
    webmodeler:
      applications:
        - name: "Hub"
          id: web-modeler
          type: public
          root-url: "https://webmodeler.${HOST}"
          redirect-uris:
            - "/login-callback"
      apis:
        - name: Hub Internal API
          audience: "web-modeler-api"
          permissions:
            - definition: write:*
              description: "Write permission"
            - definition: admin:*
              description: "Admin permission"
            - definition: admin:clusters
              description: "Cluster management permission"
            - definition: admin:catalog
              description: "Catalog management permission"
            - definition: admin:bi
              description: "Business intelligence management permission"
        - name: Hub API
          audience: "web-modeler-public-api"
          permissions:
            - definition: create:*
              description: "Allows create access for all resources"
            - definition: read:*
              description: "Allows read access to all resources"
            - definition: update:*
              description: "Allows update access to all resources"
            - definition: delete:*
              description: "Allows delete access for all resources"
      roles:
        - name: "Hub"
          description: "Grants full access to Hub"
          permissions:
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
        - name: "Hub Admin"
          description: "Grants elevated access to Hub"
          permissions:
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "web-modeler-api"
              definition: admin:*
        - name: "Analyst"
          description: "Grants full access to Optimize and to Hub. Additionally, grants management access to Hub's catalog and business intelligence features"
          permissions:
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: admin:catalog
            - audience: "web-modeler-api"
              definition: admin:bi
        - name: "DevOps"
          description: "Grants access to Hub's cluster management (replaces the former Console role)"
          permissions:
            - audience: "web-modeler-api"
              definition: write:*
            - audience: "camunda-identity-resource-server"
              definition: read:users
            - audience: "web-modeler-api"
              definition: admin:clusters

keycloak:
  url: "http://${KEYCLOAK_HOST}:18080/auth"
  setup:
    user: "${KEYCLOAK_ADMIN_USER}"
    password: "${KEYCLOAK_ADMIN_PASSWORD}"
  init:
    orchestration:
      secret: ${VALUES_KEYCLOAK_INIT_ORCHESTRATION_SECRET}
    optimize:
      secret: ${VALUES_KEYCLOAK_INIT_OPTIMIZE_SECRET}
    connectors:
      secret: ${VALUES_KEYCLOAK_INIT_CONNECTORS_SECRET}
    webmodeler:
      root-url: "https://webmodeler.${HOST}"
  clients:
  environment:
    clients:
      - name: Identity
        id: "camunda-identity"
        type: CONFIDENTIAL
        secret: ${CAMUNDA_IDENTITY_CLIENT_SECRET}
        root-url: "https://identity.${HOST}"
        redirect-uris:
          - "/auth/login-callback"
          - "https://identity.${HOST}/auth/login-callback"
  users:
    - username: "demo"
      password: "${DEMO_USER_PASSWORD}"
      firstName: "Demo"
      lastName: "User"
      email: "demo@example.org"
      roles:
        - ManagementIdentity
        - Optimize
        - Analyst
        - Hub
        - Hub Admin
        - DevOps
        - Orchestration

server:
  port: 8084

spring:
  profiles:
    active: keycloak

camunda:
  identity:
    audience: "camunda-identity-resource-server"
