# While the Docker images themselves are supported for production usage,
# this docker-compose.yaml is configured as a production-ready single-node
# Docker Compose profile for environments that accept the documented trade-offs.
# We recommend to use Kubernetes in production with our Helm Charts:
# https://docs.camunda.io/docs/self-managed/setup/install/
# For local development, we recommend using KIND instead of `docker-compose`:
# https://docs.camunda.io/docs/self-managed/setup/deploy/local/local-kubernetes-cluster/

# This is a full configuration with Orchestration, Operate, Tasklist, Optimize, Identity, Keycloak, Elasticsearch and Camunda Hub.
# See docker-compose.yaml for a lightweight configuration that does not include Optimize, Identity, and Keycloak.

services:
  camunda-data-init:
    image: ${CAMUNDA_IMAGE:-camunda/camunda:${CAMUNDA_VERSION:?CAMUNDA_VERSION is required}}
    container_name: camunda-data-init
    user: "0:0"
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data",
      ]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    networks:
      - camunda-platform
    restart: "no"

  orchestration: # Consolidated Zeebe + Operate + Tasklist - https://docs.camunda.io/docs/self-managed/setup/deploy/other/docker/#zeebe
    image: ${CAMUNDA_IMAGE:-camunda/camunda:${CAMUNDA_VERSION:?CAMUNDA_VERSION is required}}
    container_name: orchestration
    ports:
      - "127.0.0.1:26500:26500"
      - "127.0.0.1:9600:9600"
      - "127.0.0.1:8088:8080"
    environment: # https://docs.camunda.io/docs/self-managed/zeebe-deployment/configuration/environment-variables/
      # OIDC Authentication - Environment-specific URLs and secrets
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_CLIENTID: ${ORCHESTRATION_CLIENT_ID}
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_CLIENTSECRET: ${ORCHESTRATION_CLIENT_SECRET:?ORCHESTRATION_CLIENT_SECRET is required}
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_AUDIENCES_0: orchestration
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_AUDIENCES_1: orchestration-api
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_AUDIENCES_2: web-modeler-api
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_AUTHORIZATIONURI: https://keycloak.${HOST:?HOST is required}/auth/realms/camunda-platform/protocol/openid-connect/auth
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_TOKENURI: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_JWKSETURI: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_REDIRECTURI: https://orchestration.${HOST:?HOST is required}/sso-callback
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_USERNAMECLAIM: preferred_username
      CAMUNDA_SECURITY_AUTHENTICATION_OIDC_CLIENTIDCLAIM: client_id
      ZEEBE_BROKER_GATEWAY_SECURITY_AUTHENTICATION_IDENTITY_ISSUERBACKENDURL: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform
      # Identity integration
      CAMUNDA_IDENTITY_ISSUERBACKENDURL: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform
      CAMUNDA_IDENTITY_BASEURL: http://identity:8084
      CAMUNDA_IDENTITY_AUDIENCE: orchestration-api
      # Database configuration (RDBMS)
      SPRING_DATASOURCE_URL: jdbc:postgresql://camunda-db:5432/camunda
      SPRING_DATASOURCE_USERNAME: camunda
      SPRING_DATASOURCE_PASSWORD: ${CAMUNDA_DB_PASSWORD:?CAMUNDA_DB_PASSWORD is required}
      # Resource limits
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      CAMUNDA_LICENSE_KEY: ${CAMUNDA_LICENSE_KEY:-}
      # Centralized secrets (8.10, alpha): each file in ./secrets is a secret,
      # referenced in BPMN as =camunda.secrets.NAME. Independent of the legacy
      # {{secrets.NAME}} lookup via connector-secrets.txt.
      CAMUNDA_SECRETS_STORES_FILE_DEFAULT_PATH: /etc/camunda/secrets
      JAVA_TOOL_OPTIONS: "-Xms4500m -Xmx4500m"
    env_file:
      - path: .env
        required: true
      - path: .env-credentials
        required: true
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 4G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - orchestration:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - "./.orchestration/application.yaml:/usr/local/camunda/config/application.yaml"
      - "./secrets:/etc/camunda/secrets:ro"
    networks:
      - camunda-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully
      camunda-db:
        condition: service_healthy

  connectors: # https://docs.camunda.io/docs/self-managed/connectors-deployment/connectors-configuration/
    image: ${CAMUNDA_CONNECTORS_IMAGE:-camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION}}
    container_name: connectors
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      # Orchestration connection - service addresses and credentials
      CAMUNDA_CLIENT_RESTADDRESS: http://orchestration:8080
      CAMUNDA_CLIENT_GRPCADDRESS: http://orchestration:26500
      CAMUNDA_CLIENT_AUTH_ISSUERURL: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform
      CAMUNDA_CLIENT_AUTH_TOKENURL: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      CAMUNDA_CLIENT_AUTH_CLIENTID: ${CONNECTORS_CLIENT_ID}
      CAMUNDA_CLIENT_AUTH_CLIENTSECRET: ${CONNECTORS_CLIENT_SECRET:?CONNECTORS_CLIENT_SECRET is required}
      CAMUNDA_LICENSE_KEY: ${CAMUNDA_LICENSE_KEY:-}
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    env_file:
      - path: .env-credentials
        required: true
      - path: connector-secrets.txt
        required: true
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health/readiness",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - "./.connectors/application.yaml:/app/application.yaml"
    networks:
      - camunda-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      orchestration:
        condition: service_healthy

  optimize: # https://docs.camunda.io/docs/self-managed/setup/deploy/other/docker/#optimize
    image: camunda/optimize:${CAMUNDA_OPTIMIZE_VERSION}
    container_name: optimize
    # PID 1 in the image is a bash wrapper (optimize.sh) that does not forward
    # SIGTERM, so every stop/backup waited for the full timeout and ended in
    # SIGKILL. tini as init forwards the signal and the container stops in ~1s.
    init: true
    ports:
      - "127.0.0.1:8083:8090"
    environment: # https://docs.camunda.io/docs/self-managed/optimize-deployment/install-and-start/
      # Elasticsearch connection
      OPTIMIZE_ELASTICSEARCH_HOST: elasticsearch
      OPTIMIZE_ELASTICSEARCH_HTTP_PORT: "9200"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      SPRING_PROFILES_ACTIVE: ccsm
      # Identity integration - URLs and credentials
      CAMUNDA_OPTIMIZE_IDENTITY_ISSUER_URL: https://keycloak.${HOST:?HOST is required}/auth/realms/camunda-platform
      CAMUNDA_OPTIMIZE_IDENTITY_ISSUER_BACKEND_URL: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform
      CAMUNDA_OPTIMIZE_IDENTITY_CLIENTID: optimize
      CAMUNDA_OPTIMIZE_IDENTITY_CLIENTSECRET: ${OPTIMIZE_CLIENT_SECRET:?OPTIMIZE_CLIENT_SECRET is required}
      CAMUNDA_OPTIMIZE_IDENTITY_AUDIENCE: optimize-api
      CAMUNDA_OPTIMIZE_IDENTITY_BASE_URL: http://identity:8084
      # Optimize 8.9's Identity SDK also reads the generic CAMUNDA_IDENTITY_*
      # properties. Override the stack-wide .env-credentials values here so
      # Optimize does not use the camunda-identity client secret during the
      # OAuth callback token exchange.
      CAMUNDA_IDENTITY_ISSUER: https://keycloak.${HOST:?HOST is required}/auth/realms/camunda-platform
      CAMUNDA_IDENTITY_ISSUER_BACKEND_URL: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform
      CAMUNDA_IDENTITY_CLIENT_ID: optimize
      CAMUNDA_IDENTITY_CLIENT_SECRET: ${OPTIMIZE_CLIENT_SECRET:?OPTIMIZE_CLIENT_SECRET is required}
      CAMUNDA_IDENTITY_AUDIENCE: optimize-api
      CAMUNDA_IDENTITY_BASE_URL: http://identity:8084
      # Trust X-Forwarded headers from reverse proxy (required for correct URL construction behind HTTPS proxy)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Management endpoints
      management.endpoints.web.exposure.include: health
      management.endpoint.health.probes.enabled: "true"
      CAMUNDA_LICENSE_KEY: ${CAMUNDA_LICENSE_KEY:-}
      JAVA_TOOL_OPTIONS: "-Xms2304m -Xmx2304m"
    env_file:
      - path: .env-credentials
        required: true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "--spider",
          "http://localhost:8090/api/readyz",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - "./.optimize/environment-config.yaml:/optimize/config/environment-config.yaml"
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1536m
    networks:
      - camunda-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      identity:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  identity: # https://docs.camunda.io/docs/self-managed/setup/deploy/other/docker/#identity
    container_name: identity
    image: camunda/identity:${CAMUNDA_IDENTITY_VERSION}
    ports:
      - "127.0.0.1:8084:8084"
    environment: # https://docs.camunda.io/docs/self-managed/identity/miscellaneous/configuration-variables/
      IDENTITY_DATABASE_HOST: postgres
      IDENTITY_DATABASE_PORT: 5432
      IDENTITY_DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      IDENTITY_DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      IDENTITY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      VALUES_KEYCLOAK_INIT_ORCHESTRATION_SECRET: ${ORCHESTRATION_CLIENT_SECRET:?ORCHESTRATION_CLIENT_SECRET is required}
      VALUES_KEYCLOAK_INIT_OPTIMIZE_SECRET: ${OPTIMIZE_CLIENT_SECRET:?OPTIMIZE_CLIENT_SECRET is required}
      VALUES_KEYCLOAK_INIT_CONNECTORS_SECRET: ${CONNECTORS_CLIENT_SECRET:?CONNECTORS_CLIENT_SECRET is required}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      HOST: ${HOST:?HOST is required}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}
      RESOURCE_PERMISSIONS_ENABLED: ${RESOURCE_AUTHORIZATIONS_ENABLED:?RESOURCE_AUTHORIZATIONS_ENABLED is required}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      management.endpoints.web.exposure.include: health
      management.endpoint.health.probes.enabled: true
      CAMUNDA_IDENTITY_CLIENT_SECRET: ${CAMUNDA_IDENTITY_CLIENT_SECRET:?CAMUNDA_IDENTITY_CLIENT_SECRET is required}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?DEMO_USER_PASSWORD is required}
      CAMUNDA_LICENSE_KEY: ${CAMUNDA_LICENSE_KEY:-}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    env_file:
      - path: .env-credentials
        required: true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "--spider",
          "http://localhost:8082/actuator/health",
        ]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256m
    volumes:
      - "./.identity/application.yaml:/app/application.yaml"
    networks:
      - camunda-platform
      - identity-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy

  postgres: # https://hub.docker.com/_/postgres
    container_name: postgres
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    env_file:
      - path: .env-credentials
        required: true
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - identity-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  camunda-db:
    container_name: camunda-db
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_DB: camunda
      POSTGRES_USER: camunda
      POSTGRES_PASSWORD: ${CAMUNDA_DB_PASSWORD:?CAMUNDA_DB_PASSWORD is required}
    env_file:
      - path: .env-credentials
        required: true
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d camunda -U camunda"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - camunda-db:/var/lib/postgresql/data
    networks:
      - camunda-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"

  keycloak: # https://hub.docker.com/r/camunda/keycloak
    container_name: keycloak
    image: camunda/keycloak:${KEYCLOAK_SERVER_VERSION}
    command: [start]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 18080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_TRANSACTION_XA_ENABLED: "false"
    env_file:
      - path: .env-credentials
        required: true
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e \"GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && timeout 5 cat <&3 | grep -q \"200 OK\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - camunda-platform
      - identity-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  elasticsearch: # https://hub.docker.com/_/elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      - cluster.max_shards_per_node=1000
      - "action.auto_create_index=.security*,zeebe-record*,operate-*,tasklist-*,optimize-*,camunda-*,web-modeler-*,identity-*"
      - indices.memory.index_buffer_size=20%
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%
      - indices.breaker.total.limit=75%
      - path.repo=/usr/share/elasticsearch/backup
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    env_file:
      - path: .env-credentials
        required: true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 3G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cat/health | grep -q green",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - elastic:/usr/share/elasticsearch/data
      - elastic-backup:/usr/share/elasticsearch/backup
    networks:
      - camunda-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-modeler-db:
    container_name: web-modeler-db
    image: postgres:${POSTGRES_VERSION}
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 256m
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-d",
          "${WEBMODELER_DB_NAME:?WEBMODELER_DB_NAME is required}",
          "-U",
          "${WEBMODELER_DB_USER:?WEBMODELER_DB_USER is required}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_DB: ${WEBMODELER_DB_NAME:?WEBMODELER_DB_NAME is required}
      POSTGRES_USER: ${WEBMODELER_DB_USER:?WEBMODELER_DB_USER is required}
      POSTGRES_PASSWORD: ${WEBMODELER_DB_PASSWORD:?WEBMODELER_DB_PASSWORD is required}
    env_file:
      - path: .env-credentials
        required: true
    networks:
      - web-modeler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - postgres-web:/var/lib/postgresql/data

  mailpit:
    # If you want to use your own SMTP server, you can remove this container
    # and configure RESTAPI_MAIL_HOST, RESTAPI_MAIL_PORT, REST_API_MAIL_USER,
    # REST_API_MAIL_PASSWORD and RESTAPI_MAIL_ENABLE_TLS in hub
    container_name: mailpit
    image: axllent/mailpit:${MAILPIT_VERSION}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8075:8025"
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.05"
          memory: 32m
    healthcheck:
      test: ["CMD", "/usr/bin/nc", "-z", "localhost", "1025"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web-modeler
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hub:
    # Camunda Hub (8.10+) replaces Web Modeler and Console. It reuses the
    # existing Web Modeler database (web-modeler-db / postgres-web) and
    # migrates its schema in place with Flyway on first start. The migration
    # is NOT backwards compatible: take a backup before the first 8.10 start.
    container_name: hub
    image: ${HUB_IMAGE:-camunda/hub:${CAMUNDA_HUB_VERSION:?CAMUNDA_HUB_VERSION is required}}
    ports:
      - "127.0.0.1:8070:8081"
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    depends_on:
      web-modeler-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O-",
          "--no-verbose",
          "--tries=1",
          "http://localhost:8091/health/readiness",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      # Generous start period so autoheal does not restart Hub while the
      # one-time 8.9 -> 8.10 database migration is still running. Failed
      # checks inside the start period do not count; a normal start becomes
      # healthy as soon as the first check passes.
      start_period: 600s
    environment:
      JAVA_OPTIONS: -Xmx1280m
      LOGGING_LEVEL_IO_CAMUNDA_MODELER: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_CONNECTIONS_POOLING: WARN
      CAMUNDA_IDENTITY_BASEURL: http://identity:8084/
      SPRING_DATASOURCE_URL: jdbc:postgresql://web-modeler-db:5432/${WEBMODELER_DB_NAME:?WEBMODELER_DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${WEBMODELER_DB_USER:?WEBMODELER_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${WEBMODELER_DB_PASSWORD:?WEBMODELER_DB_PASSWORD is required}
      SPRING_PROFILES_INCLUDE: default-logging
      RESTAPI_PUSHER_HOST: hub-websockets
      RESTAPI_PUSHER_PORT: "8060"
      RESTAPI_PUSHER_APP_ID: ${WEBMODELER_PUSHER_APP_ID:?WEBMODELER_PUSHER_APP_ID is required}
      RESTAPI_PUSHER_KEY: ${WEBMODELER_PUSHER_KEY:?WEBMODELER_PUSHER_KEY is required}
      RESTAPI_PUSHER_SECRET: ${WEBMODELER_PUSHER_SECRET:?WEBMODELER_PUSHER_SECRET is required}
      # OIDC: Hub 8.10 authenticates via the Camunda Security Library and
      # translates these legacy keys to camunda.security.authentication.oidc.*
      # at startup (same keys as the upstream 8.10 Compose setup). Migrate them
      # to CAMUNDA_SECURITY_AUTHENTICATION_OIDC_* before 8.11 removes them.
      RESTAPI_OAUTH2_TOKEN_ISSUER: https://keycloak.${HOST:?HOST is required}/auth/realms/camunda-platform
      RESTAPI_OAUTH2_TOKEN_ISSUER_BACKEND_URL: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://keycloak.${HOST:?HOST is required}/auth/realms/camunda-platform
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://${KEYCLOAK_HOST:?KEYCLOAK_HOST is required}:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
      OAUTH2_CLIENT_ID: web-modeler
      OAUTH2_TOKEN_ISSUER: https://keycloak.${HOST:?HOST is required}/auth/realms/camunda-platform
      IDENTITY_BASE_URL: http://identity:8084/
      # Hub keeps the webmodeler.{HOST} proxy hostname so existing Keycloak
      # redirect URIs stay valid; console.{HOST} redirects here via Caddy.
      RESTAPI_SERVER_URL: https://webmodeler.${HOST:?HOST is required}
      RESTAPI_MAIL_HOST: mailpit
      RESTAPI_MAIL_PORT: 1025
      RESTAPI_MAIL_ENABLE_TLS: "false"
      RESTAPI_MAIL_FROM_ADDRESS: ${WEBMODELER_MAIL_FROM_ADDRESS:?WEBMODELER_MAIL_FROM_ADDRESS is required}
      management.endpoints.web.exposure.include: health,info
      management.endpoint.health.probes.enabled: true
      SERVER_HTTPS_ONLY: "false"
      # Hub 8.10 builds absolute redirects (e.g. /login) itself; trust Caddy's
      # X-Forwarded-* headers so they use https://webmodeler.{HOST}.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # 8.10 renamed PLAY_ENABLED to TEST_MODE_ENABLED.
      TEST_MODE_ENABLED: "true"
      CLIENT_PUSHER_HOST: webmodeler.${HOST:?HOST is required}
      CLIENT_PUSHER_PORT: "443"
      CLIENT_PUSHER_FORCE_TLS: "true"
      CLIENT_PUSHER_KEY: ${WEBMODELER_PUSHER_KEY:?WEBMODELER_PUSHER_KEY is required}
      CAMUNDA_LICENSE_KEY: ${CAMUNDA_LICENSE_KEY:-}
      # Values consumed by the cluster registration in .hub/application.yaml.
      HOST: ${HOST:?HOST is required}
      HUB_CLUSTER_TAG: ${DISPLAY_STAGE:-${STAGE:?STAGE is required}}
      RESOURCE_AUTHORIZATIONS_ENABLED: ${RESOURCE_AUTHORIZATIONS_ENABLED:?RESOURCE_AUTHORIZATIONS_ENABLED is required}
      CAMUNDA_VERSION: ${CAMUNDA_VERSION:?CAMUNDA_VERSION is required}
      CAMUNDA_OPTIMIZE_VERSION: ${CAMUNDA_OPTIMIZE_VERSION:?CAMUNDA_OPTIMIZE_VERSION is required}
      CAMUNDA_CONNECTORS_VERSION: ${CAMUNDA_CONNECTORS_VERSION:?CAMUNDA_CONNECTORS_VERSION is required}
      CAMUNDA_IDENTITY_VERSION: ${CAMUNDA_IDENTITY_VERSION:?CAMUNDA_IDENTITY_VERSION is required}
    env_file:
      - path: .env-credentials
        required: true
    volumes:
      - "./.hub/application.yaml:/home/runner/config/application.yaml:ro"
    networks:
      - web-modeler
      - camunda-platform
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hub-websockets:
    container_name: hub-websockets
    # PID 1 in the image is /bin/sh docker-entrypoint.sh, which does not forward
    # SIGTERM (stop always hit the timeout and ended in SIGKILL). tini fixes it.
    init: true
    image: ${HUB_WEBSOCKETS_IMAGE:-camunda/hub-websockets:${CAMUNDA_HUB_VERSION:?CAMUNDA_HUB_VERSION is required}}
    ports:
      - "127.0.0.1:8060:8060"
    labels:
      - autoheal=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8060/up",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      APP_NAME: "Hub Self-Managed WebSockets"
      APP_DEBUG: "false"
      PUSHER_APP_ID: ${WEBMODELER_PUSHER_APP_ID:?WEBMODELER_PUSHER_APP_ID is required}
      PUSHER_APP_KEY: ${WEBMODELER_PUSHER_KEY:?WEBMODELER_PUSHER_KEY is required}
      PUSHER_APP_SECRET: ${WEBMODELER_PUSHER_SECRET:?WEBMODELER_PUSHER_SECRET is required}
    env_file:
      - path: .env-credentials
        required: true
    networks:
      - web-modeler
    extra_hosts:
      - "host.docker.internal:host-gateway"

  autoheal:
    image: willfarrell/autoheal@sha256:75c28b0020543e8eb49fe6514d012e7d2691f095dd622309d045da8647c8bb83
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  reverse-proxy:
    image: caddy:2.11.2@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    container_name: reverse-proxy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dashboard:/srv/dashboard:ro
      - ./certs:/certs:ro
    environment:
      - HOST=${HOST:?HOST is required}
      - CAMUNDA_VERSION=${CAMUNDA_VERSION:?CAMUNDA_VERSION is required}
      - STAGE=${STAGE:?STAGE is required}
      - DISPLAY_STAGE=${DISPLAY_STAGE:-}
      - BANNER_DARKMODE=${BANNER_DARKMODE}
      - BANNER_LIGHTMODE=${BANNER_LIGHTMODE}
    labels:
      - autoheal=true
    networks:
      - camunda-platform
      - identity-network
      - web-modeler
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:2019/config/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

volumes:
  orchestration:
  camunda-data:
  elastic:
  elastic-backup:
    name: elastic-backup
  postgres:
  # Hub database volume (formerly Web Modeler). Do NOT rename: Hub 8.10
  # migrates the existing data in place.
  postgres-web:
  camunda-db:

networks:
  # Note there are three bridge networks: One for Camunda Platform, one for Identity and one for Camunda Hub.
  # Identity and Keycloak are part of the first two as they need to be accessible by platform components.
  # Hub has its own network (still named `web-modeler` so existing deployments keep their network and volume
  # names) because it consists of three components that communicate with each other (hub, hub-websockets,
  # web-modeler-db). It is also part of the camunda-platform network to communicate with the platform components
  # like Orchestration to run processes or Identity to log in.
  camunda-platform:
  identity-network:
  web-modeler:
