# Test stage resources.
# Compact profile for constrained test hosts; heavy and medium services are reduced further.
services:
  camunda-data-init:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  orchestration:
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3072M
        reservations:
          cpus: "0.25"
          memory: 1536M
    environment:
      JAVA_TOOL_OPTIONS: "-Xms2304m -Xmx2304m"

  elasticsearch:
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 1024M
    environment:
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"

  optimize:
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    environment:
      JAVA_TOOL_OPTIONS: "-Xms768m -Xmx768m"

  keycloak:
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  connectors:
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 192M
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"

  identity:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.125"
          memory: 192M
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"

  hub:
    # Camunda Hub replaces web-modeler-restapi and console (8.10).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.125"
          memory: 384M
    environment:
      JAVA_OPTIONS: "-Xmx512m"

  postgres:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.125"
          memory: 256M

  camunda-db:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  web-modeler-db:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M

  hub-websockets:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  mailpit:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  reverse-proxy:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
